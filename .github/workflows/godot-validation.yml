name: Godot Project Validation

on:
  push:
    branches:
      - feature/registration-character-creator
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Godot 4.3
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.3.0
          use-dotnet: false
          include-templates: false

      - name: Import and parse project
        run: godot --headless --editor --path . --quit

      - name: Launch main scene briefly
        run: godot --headless --path . --quit-after 3

      - name: Install virtual display
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb

      - name: Capture actual Character Creator screen
        run: xvfb-run -a godot --path . --script tools/capture_character_creator.gd

      - name: Upload Character Creator preview
        uses: actions/upload-artifact@v4
        with:
          name: character-creator-preview
          path: character_creator_preview.png
          if-no-files-found: error
